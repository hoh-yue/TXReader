<!doctype html>
<html lang="zh-CN" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#242628" />
    <meta name="description" content="一个轻巧、离线可用的中文 TXT 阅读器" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>拾页 · 中文阅读器</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar home-mode">
        <button class="icon-button" id="libraryButton" aria-label="返回书架" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="book-heading">
          <strong id="bookTitle">拾页</strong>
          <span id="chapterTitle">你的随身中文阅读器</span>
        </div>
        <button class="icon-button" id="contentsButton" type="button" aria-label="打开目录" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
        </button>
        <button class="icon-button" id="settingsButton" aria-label="阅读设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg>
        </button>
      </header>

      <main id="reader" class="reader" tabindex="0">
        <section id="welcome" class="welcome shelf-home">
          <div class="shelf-intro">
            <div class="seal" aria-hidden="true">拾<br/>页</div>
            <div><p class="eyebrow">离线 · 私密 · 专注</p><h1>我的书架</h1></div>
          </div>
          <p class="welcome-copy">选择一本书继续阅读，所有进度只保存在你的设备中。</p>
          <label class="primary-button" for="fileInput">＋ 导入 TXT 书籍</label>
          <input id="fileInput" type="file" accept=".txt,text/plain" multiple hidden />
          <div id="emptyShelf" class="empty-shelf">
            <span>书</span>
            <strong>书架还是空的</strong>
            <small>支持 UTF-8 与 GB18030 编码</small>
          </div>
          <div id="homeBookList" class="home-book-list"></div>
        </section>

        <article id="readingView" class="reading-view" hidden>
          <div id="pageText" class="page-text"></div>
          <button id="tapPrevious" class="tap-zone tap-zone-left" aria-label="上一页"></button>
          <button id="tapNext" class="tap-zone tap-zone-right" aria-label="下一页"></button>
        </article>
      </main>

      <footer id="readingFooter" class="reading-footer" hidden>
        <button id="prevPage" class="page-button" aria-label="上一页">上一页</button>
        <div class="progress-wrap">
          <span id="progressText">0 / 0</span>
          <div class="progress-track"><i id="progressBar"></i></div>
        </div>
        <button id="nextPage" class="page-button" aria-label="下一页">下一页</button>
      </footer>
    </div>

    <div id="scrim" class="scrim" hidden></div>

    <aside id="libraryPanel" class="panel panel-left" aria-hidden="true">
      <div class="panel-header">
        <div><span class="eyebrow">CONTENTS</span><h2>目录</h2></div>
        <button class="close-button" data-close aria-label="关闭">×</button>
      </div>
      <div id="chapterSection" class="chapter-section" hidden>
        <div class="section-label">章节</div>
        <nav id="chapterList" class="chapter-list"></nav>
      </div>
    </aside>

    <aside id="settingsPanel" class="panel panel-right" aria-hidden="true">
      <div class="panel-header">
        <div><span class="eyebrow">DISPLAY</span><h2>阅读设置</h2></div>
        <button class="close-button" data-close aria-label="关闭">×</button>
      </div>
      <section class="setting-block">
        <label>文字大小</label>
        <div class="font-control">
          <button id="fontDown" aria-label="缩小文字">字－</button>
          <output id="fontSizeValue">20</output>
          <button id="fontUp" aria-label="放大文字">字＋</button>
        </div>
        <div class="font-preview" aria-label="字号预览">
          <small>字号预览</small>
          <p>山有木兮木有枝，心悦君兮君不知。</p>
        </div>
      </section>
      <section class="setting-block">
        <label>阅读背景</label>
        <div id="themeChoices" class="theme-choices">
          <button data-theme="paper" class="theme-dot paper active" aria-label="米白"></button>
          <button data-theme="white" class="theme-dot white" aria-label="纯白"></button>
          <button data-theme="green" class="theme-dot green" aria-label="护眼绿"></button>
          <button data-theme="night" class="theme-dot night" aria-label="夜间"></button>
        </div>
      </section>
      <section class="setting-block">
        <label for="encodingSelect">文本编码</label>
        <select id="encodingSelect">
          <option value="auto">自动识别</option>
          <option value="utf-8">UTF-8</option>
          <option value="gb18030">GB18030 / GBK</option>
        </select>
        <p class="setting-note">若文字显示乱码，请切换编码后重新导入。</p>
      </section>
      <section class="setting-block">
        <label>应用存储</label>
        <button id="clearCacheButton" class="settings-action" type="button">清除应用数据（保留书籍）</button>
        <p class="setting-note">保留所有导入的书籍，但将阅读进度重置到第一页，并清除显示设置和离线缓存。</p>
      </section>
      <section class="setting-block">
        <label>应用更新</label>
        <p class="setting-note">当前版本：<strong id="appVersion">v42</strong></p>
        <button id="checkUpdateButton" class="settings-action" type="button">检查更新</button>
        <p class="setting-note">应用不会自动检查更新。联网后手动检查即可确认是否为最新版本。</p>
      </section>
    </aside>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js" defer></script>
  </body>
</html>
